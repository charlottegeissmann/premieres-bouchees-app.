<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premières Bouchées</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Figtree:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F5F1E6;
    --surface:#FFFFFF;
    --surface-2:#ECE5D3;
    --surface-3:#E2D9C2;
    --ink:#2B2230;
    --ink-soft:#6C6072;
    --ink-faint:#948A97;
    --accent:#DE7A3D;
    --accent-ink:#FFFFFF;
    --accent-soft:#F6DEC5;
    --ok:#5F8A56;
    --ok-soft:#DEE9D6;
    --warn:#B4862A;
    --warn-soft:#F0E3C4;
    --danger:#BD4258;
    --danger-soft:#F4DBDF;
    --border:#E2D9C2;
    --shadow:0 12px 30px -14px rgba(43,34,48,.28);
    --font-display:'Fraunces', Georgia, serif;
    --font-body:'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono:'Space Mono', 'SFMono-Regular', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#211A29;
      --surface:#2B2333;
      --surface-2:#362D3E;
      --surface-3:#43384C;
      --ink:#F3EEE9;
      --ink-soft:#C2B8C7;
      --ink-faint:#8E8296;
      --accent:#F0975C;
      --accent-ink:#241708;
      --accent-soft:#4A3421;
      --ok:#8FB980;
      --ok-soft:#33402E;
      --warn:#E1C061;
      --warn-soft:#463A20;
      --danger:#E68A98;
      --danger-soft:#4A2A31;
      --border:#43384C;
      --shadow:0 12px 30px -14px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#211A29;
    --surface:#2B2333;
    --surface-2:#362D3E;
    --surface-3:#43384C;
    --ink:#F3EEE9;
    --ink-soft:#C2B8C7;
    --ink-faint:#8E8296;
    --accent:#F0975C;
    --accent-ink:#241708;
    --accent-soft:#4A3421;
    --ok:#8FB980;
    --ok-soft:#33402E;
    --warn:#E1C061;
    --warn-soft:#463A20;
    --danger:#E68A98;
    --danger-soft:#4A2A31;
    --border:#43384C;
    --shadow:0 12px 30px -14px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;}
  h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;}
  button{font-family:inherit;}
  input,textarea,select{font-family:inherit;font-size:1rem;color:var(--ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky;top:0;z-index:10;
    background:var(--bg);
    padding:16px 16px 0;
    border-bottom:1px solid var(--border);
  }
  .topbar-main{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{font-size:1.9rem;line-height:1;}
  .brand-text h1{font-size:1.5rem;letter-spacing:-.01em;}
  .subtitle{margin:2px 0 0;font-size:.85rem;color:var(--ink-soft);}
  .icon-btn{
    width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);font-size:1.15rem;cursor:pointer;flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:hover{background:var(--surface-2);}

  .stats-row{display:flex;gap:14px;margin:16px 0 12px;}
  .stat{flex:1;min-width:0;}
  .stat-value{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:1.05rem;}
  .stat-label{font-size:.7rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:1px;}
  .bar{height:6px;border-radius:99px;background:var(--surface-3);margin-top:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
  .bar-fill.accent-alt{background:var(--ok);}

  .reaction-banner{
    display:flex;align-items:center;gap:8px;width:100%;margin-bottom:12px;
    background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);
    border-radius:12px;padding:9px 12px;font-size:.85rem;font-weight:600;cursor:pointer;
    text-align:left;
  }

  .tabs{display:flex;gap:4px;}
  .tab{
    flex:1;padding:10px 8px;border:none;background:none;color:var(--ink-soft);
    font-weight:600;font-size:.9rem;cursor:pointer;border-bottom:2px solid transparent;
    margin-bottom:-1px;
  }
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);}

  /* ---------- Main / views ---------- */
  main{flex:1;padding-bottom:96px;}
  .view{padding:14px 16px 0;}

  .toolbar{position:sticky;top:0;background:var(--bg);padding-top:14px;padding-bottom:10px;z-index:5;}
  #searchInput{
    width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);
  }
  #searchInput::placeholder{color:var(--ink-faint);}

  .filter-chips{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none;}
  .filter-chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:none;padding:7px 13px;border-radius:99px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);font-size:.82rem;font-weight:600;cursor:pointer;
    white-space:nowrap;
  }
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink);}

  .cat-group{margin-bottom:18px;}
  .cat-header{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:6px 2px;cursor:pointer;user-select:none;
  }
  .cat-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.95rem;}
  .cat-count{font-family:var(--font-mono);font-size:.75rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .cat-chevron{color:var(--ink-faint);transition:transform .2s ease;font-size:.75rem;}
  .cat-group.collapsed .cat-chevron{transform:rotate(-90deg);}
  .cat-group.collapsed .food-list{display:none;}

  .food-list{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;
  }
  .food-row{
    display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;
    border:none;background:none;text-align:left;cursor:pointer;border-bottom:1px solid var(--border);
    color:var(--ink);
  }
  .food-row:last-child{border-bottom:none;}
  .food-row:hover{background:var(--surface-2);}
  .food-emoji{font-size:1.35rem;flex:none;width:28px;text-align:center;}
  .food-main{flex:1;min-width:0;}
  .food-name{font-size:.95rem;font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .age-badge{
    font-family:var(--font-mono);font-size:.66rem;font-weight:700;color:var(--ink-faint);
    background:var(--surface-2);padding:1px 6px;border-radius:6px;letter-spacing:.01em;
    font-variant-numeric:tabular-nums;
  }
  .allergen-dot{width:6px;height:6px;border-radius:99px;background:var(--danger);flex:none;}
  .food-meta{font-size:.75rem;color:var(--ink-soft);font-family:var(--font-mono);margin-top:1px;}
  .status-pill{
    flex:none;font-size:.72rem;font-weight:700;padding:4px 9px;border-radius:99px;
    background:var(--surface-3);color:var(--ink-soft);white-space:nowrap;
  }
  .status-pill.ok{background:var(--ok-soft);color:var(--ok);}
  .status-pill.warn{background:var(--warn-soft);color:var(--warn);}
  .status-pill.danger{background:var(--danger-soft);color:var(--danger);}

  .empty-state{padding:40px 16px;text-align:center;color:var(--ink-soft);}
  .empty-state .em{font-size:2rem;display:block;margin-bottom:8px;}

  .hint{
    background:var(--surface-2);border:1px solid var(--border);border-radius:12px;
    padding:11px 13px;font-size:.83rem;color:var(--ink-soft);line-height:1.5;margin:0 0 14px;
  }
  .allergen-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .allergen-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px;
    text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;color:var(--ink);
  }
  .allergen-card:hover{background:var(--surface-2);}
  .allergen-top{display:flex;align-items:center;justify-content:space-between;}
  .allergen-emoji{font-size:1.4rem;}
  .allergen-name{font-size:.86rem;font-weight:700;line-height:1.25;}
  .allergen-foods{font-size:.7rem;color:var(--ink-faint);line-height:1.4;}

  .fab{
    position:fixed;left:50%;transform:translateX(calc(-1 * min(280px,45vw) + 16px));
    bottom:20px;width:52px;height:52px;border-radius:16px;border:none;
    background:var(--accent);color:var(--accent-ink);font-size:1.6rem;box-shadow:var(--shadow);
    cursor:pointer;z-index:8;
  }
  @media (min-width:560px){
    .fab{left:auto;right:calc(50vw - 280px + 20px);transform:none;}
  }

  /* ---------- Sheet / modal ---------- */
  .overlay{
    position:fixed;inset:0;background:rgba(20,14,22,.45);z-index:20;
    display:flex;align-items:flex-end;justify-content:center;
  }
  .sheet{
    width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    background:var(--surface);border-radius:20px 20px 0 0;padding:10px 20px 24px;
    box-shadow:var(--shadow);animation:sheet-up .22s ease;
  }
  @media (prefers-reduced-motion: reduce){ .sheet{animation:none;} }
  @keyframes sheet-up{from{transform:translateY(16px);opacity:.6;}to{transform:translateY(0);opacity:1;}}
  .sheet-handle{width:36px;height:4px;background:var(--surface-3);border-radius:99px;margin:0 auto 14px;}
  .sheet-title{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .sheet-title .em{font-size:1.6rem;}
  .sheet-title h2{font-size:1.25rem;}
  .sheet-sub{font-size:.8rem;color:var(--ink-soft);margin:0 0 16px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:7px;}
  .seg{display:flex;flex-wrap:wrap;gap:7px;}
  .seg-btn{
    flex:1;min-width:86px;padding:9px 8px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink-soft);font-size:.8rem;font-weight:700;cursor:pointer;
    text-align:center;
  }
  .seg-btn.sel{border-color:currentColor;}
  .seg-btn.sel.ok{background:var(--ok-soft);color:var(--ok);}
  .seg-btn.sel.warn{background:var(--warn-soft);color:var(--warn);}
  .seg-btn.sel.danger{background:var(--danger-soft);color:var(--danger);}
  .seg-btn.sel.neutral{background:var(--surface-3);color:var(--ink);}

  input[type=date],input[type=text],textarea,select{
    width:100%;padding:10px 12px;border-radius:11px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);
  }
  textarea{resize:vertical;min-height:64px;}
  .chip-select{display:flex;flex-wrap:wrap;gap:7px;}
  .chip-select .chip{cursor:pointer;}

  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .btn{
    flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--surface);color:var(--ink);font-weight:700;font-size:.9rem;cursor:pointer;
  }
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
  .btn.ghost{background:none;color:var(--ink-soft);border-color:transparent;}
  .btn.danger-outline{color:var(--danger);border-color:var(--danger-soft);}

  .settings-section{margin-bottom:22px;}
  .settings-section h3{font-size:.95rem;margin-bottom:10px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .sync-box{background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:12px;}
  .sync-box textarea{font-family:var(--font-mono);font-size:.72rem;}
  .sync-row{display:flex;gap:8px;margin-top:8px;}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;
    font-size:.85rem;font-weight:600;z-index:40;box-shadow:var(--shadow);
  }

  [hidden]{display:none!important;}

  /* ---------- Auth gate ---------- */
  .auth-gate{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:24px;background:var(--bg);
  }
  .auth-card{
    width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);
    border-radius:20px;padding:28px 24px;box-shadow:var(--shadow);
  }
  .auth-brand{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:22px;}
  .auth-brand span{font-size:1.9rem;}
  .auth-brand h1{font-size:1.35rem;text-align:center;}
  .auth-loading{text-align:center;color:var(--ink-soft);font-size:.9rem;}
  .auth-tabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--border);}
  .auth-tab{
    flex:1;padding:9px 6px;border:none;background:none;color:var(--ink-soft);
    font-weight:600;font-size:.88rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .auth-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
  .auth-error{
    background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:9px 12px;
    font-size:.82rem;margin-bottom:14px;
  }
  .auth-choice-btn{
    width:100%;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--border);
    background:var(--surface-2);cursor:pointer;margin-bottom:12px;color:var(--ink);
  }
  .auth-choice-btn .em{font-size:1.3rem;margin-right:8px;}
  .auth-choice-btn strong{display:block;font-size:.95rem;margin-bottom:2px;}
  .auth-choice-btn span.desc{font-size:.78rem;color:var(--ink-soft);}
  .code-reveal{
    text-align:center;font-family:var(--font-mono);font-size:1.7rem;font-weight:700;
    letter-spacing:.12em;background:var(--accent-soft);color:var(--accent);border-radius:14px;
    padding:16px;margin:16px 0;
  }
</style>
</head>
<body>

<div id="authGate" class="auth-gate">
  <div class="auth-card">
    <div class="auth-brand"><span aria-hidden="true">🥄</span><h1>Premières Bouchées</h1></div>
    <div id="authGateContent"><p class="auth-loading">Chargement…</p></div>
  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-main">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">🥄</span>
        <div class="brand-text">
          <h1>Premières Bouchées</h1>
          <p class="subtitle" id="babySubtitle">Bienvenue !</p>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙️</button>
    </div>

    <div class="stats-row">
      <div class="stat">
        <div class="stat-value"><span id="statFoods">0/0</span></div>
        <div class="stat-label">aliments testés</div>
        <div class="bar"><div class="bar-fill" id="barFoods" style="width:0%"></div></div>
      </div>
      <div class="stat">
        <div class="stat-value"><span id="statAllergens">0/14</span></div>
        <div class="stat-label">allergènes testés</div>
        <div class="bar"><div class="bar-fill accent-alt" id="barAllergens" style="width:0%"></div></div>
      </div>
    </div>

    <button class="reaction-banner" id="reactionBanner" hidden></button>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-view="foods" role="tab" aria-selected="true">Aliments</button>
      <button class="tab" data-view="allergens" role="tab" aria-selected="false">Allergènes</button>
    </nav>
  </header>

  <main id="main">
    <section id="view-foods" class="view">
      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="Rechercher un aliment…" autocomplete="off">
        <div class="filter-chips" id="statusFilters"></div>
      </div>
      <div id="foodList"></div>
    </section>

    <section id="view-allergens" class="view" hidden>
      <p class="hint">Introduisez les allergènes un par un, si possible le matin, en petite quantité, puis observez 3 à 4 jours avant le suivant. En cas de réaction, contactez votre médecin.</p>
      <div class="allergen-grid" id="allergenGrid"></div>
    </section>
  </main>

  <button class="fab" id="addFoodBtn" aria-label="Ajouter un aliment">+</button>

  <div class="overlay" id="sheetOverlay" hidden>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
</div>

<script>
(function(){
  "use strict";

  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDWNNMoYkY98tFK8QaND6synJ0assWjnPA",
    authDomain: "premieres-bouchees.firebaseapp.com",
    projectId: "premieres-bouchees",
    storageBucket: "premieres-bouchees.firebasestorage.app",
    messagingSenderId: "250399219020",
    appId: "1:250399219020:web:1eb6ee318cf77cc3a343e9",
    measurementId: "G-7PB14TJ49W"
  };
  firebase.initializeApp(FIREBASE_CONFIG);

  /* ================= DATA ================= */
  var CATEGORIES = [
    {id:"legumes", label:"Légumes", emoji:"🥕"},
    {id:"fruits", label:"Fruits", emoji:"🍎"},
    {id:"feculents", label:"Féculents & céréales", emoji:"🌾"},
    {id:"proteines", label:"Viandes & œufs", emoji:"🍗"},
    {id:"poissons", label:"Poissons & fruits de mer", emoji:"🐟"},
    {id:"laitiers", label:"Produits laitiers", emoji:"🧀"},
    {id:"matieres_grasses", label:"Matières grasses", emoji:"🫒"},
    {id:"oleagineux", label:"Oléagineux & graines", emoji:"🥜"},
    {id:"aromates", label:"Herbes & épices", emoji:"🌿"},
    {id:"sucres", label:"Sucres & condiments", emoji:"🍯"}
  ];

  // Âge indicatif de démarrage par catégorie (repères habituels type PMI/pédiatrie,
  // à ajuster selon votre pédiatre) — affiché en badge "+N mois" à côté de chaque aliment.
  var CATEGORY_MIN_AGE = {
    legumes:4, fruits:4, feculents:4, proteines:6, poissons:6, laitiers:6,
    matieres_grasses:4, oleagineux:6, aromates:4, sucres:12
  };
  // Exceptions aliment par aliment (dérogent au repère de leur catégorie).
  var MIN_AGE_OVERRIDES = {
    celeri:6, artichaut:6, poivron:6, aubergine:6, chou:6, fenouil:6, radis:6, asperge:6, mais:6,
    orange:6, citron:6, clementine:6, fraise:6, framboise:6, kiwi:6, cerise:6, raisin:6,
    pates:6, semoule:6, avoine:6, pain:6, ble:6, orge:6, lentilles:6, pois_chiches:6, haricots_secs:6,
    huile_noix:6, lait_vache:12, ail:6, oignon:6, cannelle:6, vanille:6
  };
  function getMinAge(foodId, cat){
    if(MIN_AGE_OVERRIDES.hasOwnProperty(foodId)) return MIN_AGE_OVERRIDES[foodId];
    return CATEGORY_MIN_AGE[cat] || 4;
  }
  var ALLERGEN_MIN_AGE = 6;

  // Précautions ponctuelles, indépendantes de l'âge de démarrage.
  var FOOD_NOTES = {
    miel: "Risque de botulisme infantile : à éviter avant 12 mois.",
    lait_vache: "En boisson, pas avant 12 mois. Cuit et en petite quantité (yaourt, béchamel…), c'est possible dès le début de la diversification.",
    lait_soja: "Les boissons végétales ne remplacent pas le lait avant 3 ans, mais peuvent être utilisées cuisinées en petite quantité dès la diversification.",
    amande: "En purée ou poudre uniquement — pas de morceaux entiers avant 4-5 ans (étouffement).",
    noisette: "En purée ou poudre uniquement — pas de morceaux entiers avant 4-5 ans (étouffement).",

  function defaultState(){
    return {

      foods: {},       // id -> {status,date,notes,by,updatedAt}
      allergens: {},   // id -> {status,date,notes,updatedAt}

      ui: {collapsed:{}, filter:"all", search:""}
    };
  }

  var state = loadState();

  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      var parsed = JSON.parse(raw);
      var base = defaultState();
      return Object.assign(base, parsed, {
        baby: Object.assign(base.baby, parsed.baby),
        parents: Object.assign(base.parents, parsed.parents),
        foods: parsed.foods || {},
        allergens: parsed.allergens || {},
        customFoods: parsed.customFoods || [],
        ui: Object.assign(base.ui, parsed.ui)
      });
    }catch(e){ return defaultState(); }
  }

  function saveStateLocalOnly(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function saveState(){
    saveStateLocalOnly();
    schedulePush();
  }

    return FOODS.concat(state.customFoods);

  function nowIso(){ return new Date().toISOString(); }
  function todayStr(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function normalize(s){
    return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  }
  function formatDate(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length!==3) return iso;
    return p[2]+"/"+p[1]+"/"+p[0].slice(2);
  }

  function foodAgeInfo(foodId, cat){

  // Béaba classe ses recettes par tranche d'âge : 1=4/6m 2=7/8m 3=9/12m 4=13/24m 5=25m+
  function beabaBucketForAge(months){
    if(months<7) return 1;
    if(months<9) return 2;
    if(months<13) return 3;
    if(months<25) return 4;
    return 5;
  }
  function beabaUrl(minAge){
    return "https://www.beaba.com/fr-fr/recettes-bebe?age=" + beabaBucketForAge(minAge);
  }

  /* ================= STATS ================= */
  function computeStats(){
    var foods = allFoods();
    var testedFoods = 0, reactions = 0;
    foods.forEach(function(fo){
      var e = state.foods[fo.id];
      if(e && e.status && e.status !== "a_tester") testedFoods++;
      if(e && e.status === "reaction") reactions++;
    });
    var testedAllergens = 0, allergenReactions = 0;
    ALLERGENS.forEach(function(a){
      var e = state.allergens[a.id];
      if(e && e.status && e.status !== "a_tester") testedAllergens++;
      if(e && e.status === "reaction") allergenReactions++;
    });
    return {
      foodsTotal: foods.length, foodsTested: testedFoods, foodReactions: reactions,
      allergensTotal: ALLERGENS.length, allergensTested: testedAllergens, allergenReactions: allergenReactions
    };
  }

    document.getElementById("barAllergens").style.width = (st.allergensTested/st.allergensTotal*100) + "%";

    var totalReactions = st.foodReactions + st.allergenReactions;

    if(totalReactions>0){
      banner.hidden = false;
      banner.textContent = "⚠️ " + totalReactions + " réaction" + (totalReactions>1?"s":"") + " notée" + (totalReactions>1?"s":"") + " — voir le détail";

  }

      wrap.appendChild(b);

  function foodMatchesFilter(fo){
    var e = state.foods[fo.id];
    var status = e ? e.status : "a_tester";
    var filter = state.ui.filter;
    if(filter==="a_tester") return status==="a_tester";
    if(filter==="tested") return status!=="a_tester";
    if(filter==="reaction") return status==="reaction";
    return true;
  }

  function renderFoods(){
    var q = normalize(state.ui.search);
    var wrap = document.getElementById("foodList");
    wrap.innerHTML = "";
    var foods = allFoods();
    var any = false;

    CATEGORIES.forEach(function(cat){
      var items = foods.filter(function(fo){
        if(fo.cat !== cat.id) return false;
        if(!foodMatchesFilter(fo)) return false;
        if(q && normalize(fo.name).indexOf(q) === -1) return false;
        return true;
      });
      items.sort(function(a,b){ return a.name.localeCompare(b.name, "fr"); });
      if(items.length===0) return;
      any = true;

      var totalInCat = foods.filter(function(fo){return fo.cat===cat.id;}).length;
      var testedInCat = foods.filter(function(fo){
        if(fo.cat!==cat.id) return false;
        var e = state.foods[fo.id];
        return e && e.status && e.status!=="a_tester";
      }).length;

      var group = document.createElement("div");
      group.className = "cat-group" + (state.ui.collapsed[cat.id] ? " collapsed":"");

      var header = document.createElement("div");
      header.className = "cat-header";
      header.innerHTML =
        '<div class="cat-title">'+cat.emoji+' '+cat.label+'</div>'+
        '<div style="display:flex;align-items:center;gap:8px;">'+
          '<span class="cat-count">'+testedInCat+'/'+totalInCat+'</span>'+
          '<span class="cat-chevron">▾</span>'+
        '</div>';
      header.addEventListener("click", function(){
        state.ui.collapsed[cat.id] = !state.ui.collapsed[cat.id];
        saveState(); renderFoods();
      });
      group.appendChild(header);

      var list = document.createElement("div");
      list.className = "food-list";
      items.forEach(function(fo){
        var e = state.foods[fo.id];
        var status = e ? e.status : "a_tester";
        var meta = FOOD_STATUS[status];
        var ageInfo = foodAgeInfo(fo.id, fo.cat);
        var row = document.createElement("button");
        row.className = "food-row";
        row.innerHTML =
          '<span class="food-emoji">'+fo.emoji+'</span>'+

            (e && e.date ? '<span class="food-meta">'+formatDate(e.date)+'</span>' : '') +
          '</span>'+
          '<span class="status-pill '+meta.cls+'">'+(meta.emoji?meta.emoji+' ':'')+meta.label+'</span>';
        row.addEventListener("click", function(){ openFoodSheet(fo.id); });
        list.appendChild(row);
      });
      group.appendChild(list);
      wrap.appendChild(group);
    });

      wrap.innerHTML = '<div class="empty-state"><span class="em">🔍</span>Aucun aliment ne correspond.</div>';

  overlay.addEventListener("click", function(e){ if(e.target===overlay) closeSheet(); });
  document.addEventListener("keydown", function(e){ if(e.key==="Escape" && !overlay.hidden) closeSheet(); });

  function openFoodSheet(foodId){
    var fo = allFoods().find(function(x){return x.id===foodId;});
    if(!fo) return;
    var e = state.foods[foodId] || {status:"a_tester", date:"", notes:"", by:""};
    var allergenNote = fo.allergens.length ?
      '<p class="sheet-sub">⚠️ Contient : '+fo.allergens.map(function(id){
        var a = ALLERGENS.find(function(x){return x.id===id;});
        return a?a.name:id;
      }).join(", ")+'</p>' : '';

    var ageInfo = foodAgeInfo(foodId, fo.cat);
    var ageHtml = '<div class="hint">🗓️ Repère indicatif : à partir de '+ageInfo.minAge+' mois.'+(ageInfo.note?" "+ageInfo.note:"")+' <em>À ajuster avec votre pédiatre.</em></div>';
    var recipeHtml = '<a class="btn" style="display:block;text-align:center;text-decoration:none;margin-bottom:16px;" href="'+beabaUrl(ageInfo.minAge)+'" target="_blank" rel="noopener">💡 Idées de recettes avec '+fo.name.toLowerCase()+' (Béaba)</a>';

    var statusButtons = FOOD_STATUS_ORDER.map(function(k){
      var m = FOOD_STATUS[k];
      var sel = (e.status===k);
      return '<button type="button" class="seg-btn'+(sel?' sel '+(m.cls||'neutral'):'')+'" data-status="'+k+'">'+(m.emoji?m.emoji+' ':'')+m.label+'</button>';
    }).join("");

    var byOptions = ['', state.parents.a, state.parents.b, "Les deux"].map(function(v){
      var label = v || "Non précisé";
      var sel = (e.by||"")===v;
      return '<option value="'+v+'"'+(sel?' selected':'')+'>'+label+'</option>';
    }).join("");

    openSheet(
      '<div class="sheet-title"><span class="em">'+fo.emoji+'</span><h2>'+fo.name+'</h2></div>'+
      allergenNote+
      ageHtml+
      recipeHtml+
      '<div class="field"><label>État</label><div class="seg" id="statusSeg">'+statusButtons+'</div></div>'+
      '<div class="field"><label>Date</label><input type="date" id="foodDate" value="'+(e.date||"")+'"></div>'+
      '<div class="field"><label>Testé par</label><select id="foodBy">'+byOptions+'</select></div>'+
      '<div class="field"><label>Notes</label><textarea id="foodNotes" placeholder="Réaction, texture, quantité…">'+(e.notes||"")+'</textarea></div>'+
      '<div class="sheet-actions">'+
        '<button class="btn ghost" id="cancelBtn">Annuler</button>'+
        '<button class="btn primary" id="saveBtn">Enregistrer</button>'+
      '</div>',

  /* ================= SYNC — helpers partagés ================= */
  function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
  function b64decode(str){ return decodeURIComponent(escape(atob(str))); }

  function buildPayload(){
    return {
      v:2,
      foods: state.foods,
      allergens: state.allergens,
      customFoods: state.customFoods,
      baby: state.baby,
      parents: state.parents,
      exportedAt: nowIso()
    };
  }

  // Fusionne des données reçues (code manuel ou GitHub) dans l'état local :
  // pour chaque entrée, on garde toujours la plus récente (updatedAt).
  function mergeIncoming(data){
    if(!data || typeof data!=="object") return 0;
    var count = 0;

    Object.keys(data.foods||{}).forEach(function(id){
      var incoming = data.foods[id];
      var local = state.foods[id];
      if(!local || (incoming.updatedAt||"") > (local.updatedAt||"")){
        state.foods[id] = incoming; count++;
      }
    });

    Object.keys(data.allergens||{}).forEach(function(id){
      var incoming = data.allergens[id];
      var local = state.allergens[id];
      if(!local || (incoming.updatedAt||"") > (local.updatedAt||"")){
        state.allergens[id] = incoming; count++;
      }
    });

    (data.customFoods||[]).forEach(function(cf){
      var idx = state.customFoods.findIndex(function(x){return x.id===cf.id;});
      if(idx===-1){ state.customFoods.push(cf); count++; }
      else if((cf.updatedAt||"") > (state.customFoods[idx].updatedAt||"")){ state.customFoods[idx]=cf; count++; }
    });

    if(data.baby){
      if(!state.baby.name && data.baby.name) state.baby.name = data.baby.name;
    }
    if(data.parents){
      if((!state.parents.a || state.parents.a==="Maman") && data.parents.a) state.parents.a = data.parents.a;
      if((!state.parents.b || state.parents.b==="Papa") && data.parents.b) state.parents.b = data.parents.b;
    }

    return count;
  }

  /* ---------- Sauvegarde manuelle (code) ---------- */
  function exportCode(){ return b64encode(JSON.stringify(buildPayload())); }

  function importCode(code){
    var data;
    try{ data = JSON.parse(b64decode(code.trim())); }catch(e){ return {ok:false}; }
    if(!data || typeof data!=="object") return {ok:false};
    return {ok:true, count: mergeIncoming(data)};
  }

  /* ---------- Compte & famille (Firebase) ---------- */
  var FAMILY_KEY = "pb_family_v1";
  var auth = firebase.auth();
  var db = firebase.firestore();
  var familyUnsub = null;
  var syncStatus = {state:"idle", message:"", lastSyncAt:""}; // idle | syncing | ok | error
  var lastPushedFingerprint = null;
  var pushTimer = null;

  function payloadFingerprint(){
    return JSON.stringify({foods:state.foods, allergens:state.allergens, customFoods:state.customFoods, baby:state.baby, parents:state.parents});
  }

  function familyCode(){
    try{ return localStorage.getItem(FAMILY_KEY) || ""; }catch(e){ return ""; }
  }
  function setFamilyCodeLocal(code){
    try{ localStorage.setItem(FAMILY_KEY, code); }catch(e){}
  }
  function clearFamilyCodeLocal(){
    try{ localStorage.removeItem(FAMILY_KEY); }catch(e){}
  }
  function familyDocRef(code){ return db.collection("families").doc(code); }
  function generateFamilyCode(){
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sans O/0, I/1 pour éviter les confusions
    var code = "";
    for(var i=0;i<8;i++) code += chars[Math.floor(Math.random()*chars.length)];
    return code;
  }

  function setSyncStatus(s, message){
    syncStatus.state = s;
    syncStatus.message = message || "";
    if(s==="ok") syncStatus.lastSyncAt = nowIso();
    var el = document.getElementById("syncStatusLine");
    if(el) el.innerHTML = syncStatusHtml();
  }
  function syncStatusHtml(){
    if(syncStatus.state==="syncing") return "⏳ Synchronisation…";
    if(syncStatus.state==="error") return '<span style="color:var(--danger);">⚠️ '+syncStatus.message+'</span>';
    if(syncStatus.state==="ok" && syncStatus.lastSyncAt){
      var d = new Date(syncStatus.lastSyncAt);
      var hh = String(d.getHours()).padStart(2,"0"), mm = String(d.getMinutes()).padStart(2,"0");
      return '<span style="color:var(--ok);">✓ Synchronisé à '+hh+':'+mm+'</span>';
    }
    return "En attente…";
  }

  // Écoute en temps réel le document de la famille : toute modification faite par
  // l'autre parent (ou sur un autre appareil) arrive ici et se fusionne dans l'état local.
  function connectToFamily(code){
    if(familyUnsub) familyUnsub();
    setSyncStatus("syncing");
    familyUnsub = familyDocRef(code).onSnapshot(function(snap){
      if(snap.exists){
        mergeIncoming(snap.data());
        saveStateLocalOnly();
        renderAll();
      }
      setSyncStatus("ok");
    }, function(err){
      setSyncStatus("error", err.message || "Connexion perdue");
    });
  }

  function pushToFamily(){
    var code = familyCode();
    if(!code) return;
    var fp = payloadFingerprint();
    if(fp === lastPushedFingerprint) return;
    setSyncStatus("syncing");
    familyDocRef(code).set(buildPayload()).then(function(){
      lastPushedFingerprint = fp;
      setSyncStatus("ok");
    }).catch(function(err){
      setSyncStatus("error", err.message || "Erreur de synchronisation");
    });
  }

  function schedulePush(){
    if(!familyCode()) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushToFamily, 800);
  }

  // Rattache le compte connecté à un code de famille, pour qu'une future connexion
  // (même sur un autre appareil) retrouve la famille sans redemander le code.
  function userDocRef(){ return db.collection("users").doc(auth.currentUser.uid); }
  function linkAccountToFamily(code){ return userDocRef().set({familyCode: code}); }

  function createFamily(){
    var code = generateFamilyCode();
    return familyDocRef(code).set(buildPayload()).then(function(){
      return linkAccountToFamily(code);
    }).then(function(){
      setFamilyCodeLocal(code);
      lastPushedFingerprint = payloadFingerprint();
      connectToFamily(code);
      return code;
    });
  }

  function joinFamily(rawCode){
    var code = rawCode.trim().toUpperCase().replace(/\s+/g,"");
    return familyDocRef(code).get().then(function(snap){
      if(!snap.exists) throw new Error("Code introuvable — vérifiez-le auprès de votre conjoint·e.");
      mergeIncoming(snap.data());
      saveStateLocalOnly();
      renderAll();
      setFamilyCodeLocal(code);
      lastPushedFingerprint = payloadFingerprint();
      return familyDocRef(code).set(buildPayload()).then(function(){
        return linkAccountToFamily(code);
      }).then(function(){
        connectToFamily(code);
        return code;
      });
    });
  }

  function authErrorMessage(err){
    var code = err && err.code;
    if(code==="auth/email-already-in-use") return "Cet email a déjà un compte — essayez « Se connecter ».";
    if(code==="auth/invalid-email") return "Adresse email invalide.";
    if(code==="auth/weak-password") return "Mot de passe trop court (6 caractères minimum).";
    if(code==="auth/wrong-password" || code==="auth/user-not-found" || code==="auth/invalid-credential") return "Email ou mot de passe incorrect.";
    return (err && err.message) || "Erreur inconnue.";
  }

  function renderAuthForm(){
    authGateContent.innerHTML =
      '<div class="auth-tabs">'+
        '<button class="auth-tab'+(authMode==="signin"?" active":"")+'" data-mode="signin">Se connecter</button>'+

  function renderCreateFamily(){
    authGateContent.innerHTML = '<p class="sheet-sub" style="margin-top:0;">Création de votre famille…</p><div id="authError"></div>';
    createFamily().then(function(code){
      authGateContent.innerHTML =
        '<p class="sheet-sub" style="margin-top:0;">Famille créée ! Partagez ce code avec votre conjoint·e pour qu\'il/elle rejoigne :</p>'+
        '<div class="code-reveal">'+code+'</div>'+
        '<button class="btn" id="copyCodeBtn" style="width:100%;margin-bottom:10px;">Copier le code</button>'+
        '<button class="btn primary" id="continueBtn" style="width:100%;">Continuer</button>';
      document.getElementById("copyCodeBtn").addEventListener("click", function(){
        if(navigator.clipboard) navigator.clipboard.writeText(code);
      });
      document.getElementById("continueBtn").addEventListener("click", function(){
        renderAll(); showApp();
      });
    }).catch(function(err){
      authGateContent.innerHTML = '<div class="auth-error">'+(err.message||"Erreur")+'</div><button class="btn" id="backBtn" style="width:100%;margin-top:10px;">Retour</button>';
      document.getElementById("backBtn").addEventListener("click", renderFamilyChoice);
    });
  }

  function renderJoinFamily(){
    authGateContent.innerHTML =
      '<div class="field"><label>Code de famille</label><input type="text" id="joinCodeInput" placeholder="ex. A1B2C3D4" style="text-transform:uppercase;letter-spacing:.08em;font-family:var(--font-mono);"></div>'+
      '<div id="authError"></div>'+
      '<button class="btn primary" id="joinSubmitBtn" style="width:100%;margin-bottom:10px;">Rejoindre</button>'+
      '<button class="btn ghost" id="backBtn" style="width:100%;">Retour</button>';
    document.getElementById("backBtn").addEventListener("click", renderFamilyChoice);
    document.getElementById("joinSubmitBtn").addEventListener("click", function(){
      var code = document.getElementById("joinCodeInput").value;
      if(!code.trim()){ showAuthError("Entrez le code reçu."); return; }
      joinFamily(code).then(function(){
        renderAll(); showApp();
      }).catch(function(err){
        showAuthError(err.message || "Erreur");
      });
    });
  }

  auth.onAuthStateChanged(function(user){
    if(!user){
      clearFamilyCodeLocal();
      authMode = "signin";
      renderAuthForm();
      showGate();
      return;
    }
    var code = familyCode();
    if(code){
      connectToFamily(code);
      renderAll();
      showApp();
      return;
    }
    // Pas de code mémorisé sur cet appareil : on vérifie si ce compte est déjà
    // rattaché à une famille (créée/rejointe depuis un autre appareil).
    authGateContent.innerHTML = '<p class="auth-loading">Chargement…</p>';
    showGate();
    userDocRef().get().then(function(snap){
      var remoteCode = snap.exists && snap.data().familyCode;
      if(remoteCode){
        setFamilyCodeLocal(remoteCode);
        connectToFamily(remoteCode);
        renderAll();
        showApp();
      } else {
        renderFamilyChoice();
      }
    }).catch(function(){
      renderFamilyChoice();
    });
  });
})();
</script>
</body>
</html>
